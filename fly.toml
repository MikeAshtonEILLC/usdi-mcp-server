# fly.toml — generated for the USDi MCP server.
# `app` name must be globally unique on Fly; change if "usdi-mcp" is taken.

app = "usdi-mcp"
primary_region = "iad"  # US East — change to whichever region is closest to you

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # keep it always-on; agents may query anytime
  auto_start_machines = true
  min_machines_running = 1

  # Lightweight abuse protection: caps concurrent connections per machine.
  # This is not a substitute for real rate limiting, but it's a free,
  # zero-extra-infrastructure backstop against a naive flood.
  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 30

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
